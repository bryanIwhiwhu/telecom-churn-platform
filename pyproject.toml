[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-platform"
version = "1.0.0"
description = "Telecom churn: SQL warehouse, ETL, ML model, FastAPI service, monitoring and an LLM analytics agent"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "joblib>=1.4",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
agent = ["anthropic>=0.40"]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
