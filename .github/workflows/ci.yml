name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,agent]"
      - name: Lint
        run: ruff check src tests
      - name: Test (ETL, model quality gate, API, agent guardrails)
        run: pytest -q

  postgres-etl:
    # Proves the same ETL and SQL run on PostgreSQL, not just SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: churn
          POSTGRES_PASSWORD: churn
          POSTGRES_DB: churn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U churn" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://churn:churn@localhost:5432/churn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[postgres]"
      - run: python -m churn.etl
      - run: python -m churn.etl --query sql/analysis.sql

  docker:
    needs: [test, postgres-etl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (runs ETL + training inside the build)
        run: docker build -t churn-platform:ci .
      - name: Smoke test the container
        run: |
          docker run -d -p 8080:8080 --name api churn-platform:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/health && break; sleep 1; done
          curl -fs localhost:8080/model/metrics
          curl -fs localhost:8080/customers/7590-VHVEG/churn-risk
